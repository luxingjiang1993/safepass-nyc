[pytest]
testpaths = tests
markers =
    perf: 性能断言（spec UX-001 查询 P95 < 8s / UX-006 紧急 P95 < 2s，计时留 20% 余量）
    eval: tests/eval 整目录（L2 + N2；judge/对照走 cassette；不进默认基线，单独运行 python -m pytest tests/eval -q）
    l2: L2 建议质量子集（不含 N2）。改建议提示词或 Skill 必须跑 python -m pytest tests/eval -m l2 -q；默认 python -m pytest tests/ -q 因 collect_ignore 不收集本标记。本标记是文档强制挂钩，不是故意改坏 prompt 必红的满门闩
