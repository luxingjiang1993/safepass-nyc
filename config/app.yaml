# ============================================================================
# 集中配置（spec D4 / ADR-0001）
# 这是全库唯一允许出现阈值系数、样本量档位、警区号字面量的文件。
# 代码一律经 safepass/config_loader.py 读取本文件，禁止在代码中散落字面量
# （Ralph 循环的 grep 审查会检查）。
# ============================================================================

rating:
  # 相对阈值：per-100k 犯罪率 / 全市均值
  # < 0.7× → 🟢 green；0.7×–1.3× → 🟡 yellow；> 1.3× → 🔴 red
  thresholds:
    green_max_ratio: 0.7
    red_min_ratio: 1.3

  # 样本量门控（评级与可信度同源，同一 sample_size 输入；spec D4）
  # <10 → ⚪ insufficient_data，不给评级、不给可信度
  sample_size_tiers:
    - { min: 0,   max: 9,    rating: insufficient_data, confidence: null }
    - { min: 10,  max: 29,   rating: null,              confidence: LOW }
    - { min: 30,  max: 99,   rating: null,              confidence: MODERATE }
    - { min: 100, max: null, rating: null,              confidence: HIGH }

  # 可信度档固定自然语言解释模板（非学术术语；{n} = 动态真实命中数）
  confidence_explanations:
    LOW: "基于本次查询命中的 {n} 条记录，数据量有限，结论仅供参考"
    MODERATE: "基于本次查询命中的 {n} 条记录，数据量适中"
    HIGH: "基于本次查询命中的 {n} 条记录，数据量充足"

coverage:
  # 核心警区（CONTEXT.md）：19 上东区 / 109 法拉盛 / 5 唐人街 / 90 威廉斯堡 / 84 布鲁克林高地
  precincts: [19, 109, 5, 90, 84]
  # 中城跨 14/18 两个警区，无法按警区建模，明确不在覆盖清单（spec D4 / Out of Scope）
  excluded_precincts: [14, 18]
  # 警区常住人口估算（per-100k 分母）：真实 NYPD 数据无人口字段（adapter 诚实护栏，
  # 绝不逐条编造），运行时按警区号从本表 join——单一事实源只活在本文件。
  # 口径：沿用 fixtures/nypd/manifest.json 的 mock 元数据值，mock 与真实数据同一
  # 人口口径，保证两数据集比率可比；更换估算值后须运行
  # scripts/recompute_city_mean.py --update-config 重算回填 city_mean_per_100k。
  # 键必须恰好覆盖 precincts 清单（config_loader 强制校验）。
  precinct_populations:
    5: 60000
    19: 120000
    84: 95000
    90: 100000
    109: 50000

# 全市均值（per-100k）：单一公式 Σcount/Σpop × 1e5（Σpop 取 precinct_populations 口径），
# 本值 = 真实数据集（data_source.runtime_dataset_path）按该公式的复算结果，
# 由 scripts/recompute_city_mean.py 确定性产出（月更数据后重跑）。
# 运行时评级不读本值——degraded.assess_area 就加载数据集复算（评级可复现性约束，
# 数据集 + 阈值唯一决定评级）；本值是生产数据集的落盘锚点 + 无数据集上下文时
# （直接调 rate_precinct 的合成测试）的兜底。两者由
# tests/test_real_data_switch.py 锁定一致。
city_mean_per_100k: 2769.4118

output_pipeline:
  max_retries: 3          # 有限重试上界（输出控制管线）

# 免责声明：每处分析末尾自动附加（AC-010，横切字段，全部响应形态都有，含 T7 新增的 guardrail）
disclaimer: "本分析仅供参考，不替代专业安保建议。"

# ============================================================================
# 地址解析（issue 05 / D12，issue 09 / T7 扩充）：中文别名 → 警区号映射。
# 警区号字面量只出现在本文件；代码一律经 config_loader 读取。
# 中文地址识别集（10/10，PRD UX-002）与扩展标注集（>90%，NEG-007）由
# tests/test_chinese_address.py + tests/test_guardrails.py 锁定本表。
# ============================================================================
addressing:
  aliases:
    "上东区": [19]
    "上东城": [19]
    "Upper East Side": [19]
    "upper east side": [19]
    "UES": [19]
    "法拉盛": [109]
    "Flushing": [109]
    "flushing": [109]
    "唐人街": [5]
    "华埠": [5]
    "Chinatown": [5]
    "chinatown": [5]
    "威廉斯堡": [90]
    "Williamsburg": [90]
    "williamsburg": [90]
    "布鲁克林高地": [84]
    "布鲁克林 Heights": [84]
    "Brooklyn Heights": [84]
    "brooklyn heights": [84]
    # 可识别但不在覆盖清单（越界查询测试用，D12 后置校验）
    "哥大附近": [26]
    "哥伦比亚大学附近": [26]
    "Columbia University": [26]
    # 中城跨两个警区，无法按警区建模（CONTEXT.md：明确不在覆盖清单）
    "中城": [14, 18]
    "Midtown": [14, 18]
    "midtown": [14, 18]

# ============================================================================
# 负例防线（issue 09 / T7，NEG-003/004/006）：零 LLM 静态守卫。
# 判定顺序：第一层紧急检测 > 本守卫 > FC 路由（管线内确定执行）。
# bias/weapon 话术是拒绝 + 转向（结构性解释 / 合法途径），单一事实源在本节；
# panic_blacklist 是恐慌性夸大词汇黑名单，安全查询装配自检命中即明确失败。
# ============================================================================
guardrails:
  # 种族偏见诱导（NEG-003）：命中即拒绝，转向"安全由可核实数据决定"的结构性解释
  bias_markers: ["黑人", "拉丁裔", "族裔"]
  bias_message: "我们不会按种族或族裔评判任何社区的安全性。一个区域的治安状况只由可核实的公开犯罪数据决定，与族裔构成无关；如果你关心某个具体区域的安全情况，我可以按数据为你分析。"
  bias_alternatives:
    - "想看某个具体区域的安全评级，直接告诉我地名即可"
    - "我们的评级只基于公开犯罪数据统计，方法透明、可以复算"
    - "担心出行安全时，优先选择照明好、人流多的主干道并告知亲友行程"
  # 武器防身建议（NEG-004）：命中即拒绝，引导合法途径
  weapon_markers: ["防身", "武器", "电击器", "胡椒喷雾", "辣椒喷雾", "pepper spray"]
  weapon_message: "我们无法提供武器或器械的选购与携带建议；许多器械在纽约州受法律限制，携带不当可能带来法律风险。遇到安全担忧，请选择合法途径。"
  weapon_alternatives:
    - "担心出行安全时，优先选择照明好、人流多的主干道并告知亲友行程"
    - "感到被威胁时立即拨打 911，可以说中文要求转接翻译"
    - "非紧急的安全顾虑可拨打 311 咨询市政府服务"
  # 恐慌性夸大词汇黑名单（NEG-006）：安全查询的叙事文本不得出现
  panic_blacklist: ["极度危险", "九死一生", "千万别去", "危机四伏", "非常可怕", "人间地狱"]

# ============================================================================
# 会话画像（issue 09 / T7，spec D5 / ADR-0002）：作用域严格限定两处——
# ①时间风险提示的个性化表述与前置；②建议的生成语境与排序。
# 画像永不进入评级输入（画像不变性集 + NEG-009 锁定）。
# ============================================================================
profile:
  # 画像隐私透明声明（AC-023 结构断言：字段存在；措辞易懂是人工抽验项）
  notice: "画像仅在本次会话生效，关闭页面即删除"
  # 人群标签 → 个性化建议（命中标签时该建议排在最前；内容具体性属人工抽查）
  crowd_suggestions:
    "带娃": "带娃出行优先选择商场与主街照明好的路段，避开偏僻小巷"
    "带孩子": "带娃出行优先选择商场与主街照明好的路段，避开偏僻小巷"
    "老人": "老人出行尽量结伴，随身携带写有紧急联系人的卡片"
    "留学生": "留学生建议把校区与住地所属警局的联系方式存进手机"
  # 晚归画像的时间风险提示前置（命中任一标记 → 追加"时间提示"维度）
  late_night_markers: ["晚归", "夜班", "加班晚归"]
  late_night_note: "你属于晚归人群：22:00 后请优先选择照明好、人流多的主干道"

# ============================================================================
# 建议（issue 06 / T4）：空话黑名单 + 覆盖区内安全查询的通用建议。
# 结构边界 3-5 条由装配层业务校验执行（AC-006）；
# 具体性/温暖度是人工抽查项，不在机器判定范围。
# ============================================================================
suggestions:
  # 空话黑名单：以下短语不得单独成条（"注意安全"这类无信息量的建议）
  empty_talk_blacklist: ["注意安全", "小心一点", "保持警惕", "谨防意外"]
  # 覆盖区内安全查询的通用建议（3-5 条；画像个性化排序在后续切片落地）
  safety_general:
    - "夜间出行尽量结伴，并提前告知朋友行程"
    - "随身包放在身前视线范围内，手机握在手里"
    - "优先选择照明好、人流多的主干道通行"
    - "进入陌生街区前，先查看该区域的整体安全评级"
    - "遇到紧急情况直接拨打 911，可以说中文要求转接翻译"

# ============================================================================
# 追问承接（issue 08 / T6，spec D6 / F8）：细分类别标记（确定性，零 LLM）。
# FC 只负责把查询路由到 follow_up；两种合法追问与"换地点/换话题重置"
# 的细分由 followup.classify 按本表确定性判定（D12 同款后置思路）。
# comparison_markers 只在与"文本中出现上轮以外的新区域"同时命中时才构成
# 对比追问；单独命中不足以承接（承接失败 → 走新查询流程，诚实不硬凹）。
# ============================================================================
followup:
  comparison_markers: ["和", "比", "对比", "相比", "哪个更", "哪一个更"]
  time_markers: ["晚上", "夜间", "深夜", "凌晨", "白天", "下午", "傍晚", "周末", "工作日"]
  crowd_markers: ["女生", "女性", "男生", "男性", "一个人", "独自", "带娃", "带孩子", "老人", "留学生"]

# ============================================================================
# 双区对比（issue 08 / T6，spec D3 / F3）：决策辅助话术模板。
# {area} 由装配层按两侧真实聚合数据填充（评级更优 / 夜间案件占比更低的一侧）；
# 话术品味是人工抽查项，本组模板只保证结构存在、依据真实数据。
# ============================================================================
comparison:
  decision_aid_rating: "如果你更在意整体安全评级：{area}的数据表现更好。"
  decision_aid_rating_tie: "两区整体安全评级相同，可进一步对比主要犯罪类型与昼夜分布。"
  decision_aid_night: "如果你更在意夜间出行：{area}的夜间案件占比相对更低。"
  decision_aid_night_tie: "两区夜间案件占比接近。"
  decision_aid_trend_note: "长期趋势对比维度仍在开发中，暂不提供。"

# ============================================================================
# 降级分支（issue 05 / T3）：意图静态标记 + 降级话术模板。
# {area} = 解析出的区域名；{precincts} = 解析出的警区号列表（动态渲染）。
# 模板禁止出现路径级词汇（路线风险/照明/替代路线…），测试集有黑名单断言。
# ============================================================================
degraded:
  # path 判定：成对标记（全部出现）或任一单标记命中
  path_pair_markers: ["从", "到"]
  path_markers: ["怎么走", "路线", "步行", "途经"]
  trend_markers: ["趋势", "这几年", "这五年", "过去五年", "五年来", "近年", "变化"]
  explanation_templates:
    path: "{area}位于我们的数据覆盖范围内，但两点之间的路径级安全评估功能仍在开发中，目前无法给出相关结论。"
    trend: "{area}位于我们的数据覆盖范围内，但长期趋势分析功能仍在开发中，目前无法给出趋势结论。"
    path_generic: "两点之间的路径级安全评估功能仍在开发中，目前无法给出相关结论。"
    trend_generic: "长期趋势分析功能仍在开发中，目前无法给出趋势结论。"
    unrecognized: "未能识别出查询中的具体区域，无法提供该区域的安全分析。"
    out_of_coverage: "我们能识别「{area}」对应的警区（{precincts}），但该区域不在我们的数据覆盖范围内，没有可靠数据支撑分析。"
    multi_precinct: "「{area}」跨越多个警区（{precincts}），无法按警区建模，不在我们的数据覆盖范围内。"
  reselection_invitation: "你可以从以下覆盖区域中重新选择：{covered}。"
  general_suggestions:
    - "夜间出行尽量结伴，并提前告知朋友行程"
    - "随时保持手机有电，紧急情况下直接拨打 911"
    - "进入陌生街区前，先查看该区域的整体安全评级"
  insufficient_data_message: "该区域过去 12 个月的有效记录过少，暂不足以给出可靠评级。"

# ============================================================================
# 紧急检测两层 + 静态紧急组装（issue 07 / T5，spec D7）。
# 第一层：keywords 静态表命中即进无 LLM 静态分支，优先于一切 LLM 调用；
# 第二层：FC 路由 emergency_help 兜底，路由判定后同样不再生成自由文本。
# EmergencyResult 由本节模板 + fixtures/safe_places 警区静态表直接组装（<2s）。
# 全部话术禁止出现 proximity_blacklist 中的暗示定位词
# （系统无定位能力；测试集有黑名单断言）。
# ============================================================================
emergency:
  # 第一层关键词静态表：用户正处于紧急情况的中文表述（直接命中）
  keywords:
    - "救命"
    - "救我"
    - "被跟踪"
    - "有人跟踪"
    - "跟踪我"
    - "有人跟着我"
    - "跟着我"
    - "尾随"
    - "抢劫"
    - "被抢"
    - "抢包"
    - "遇袭"
    - "袭击"
    - "持刀"
    - "拿刀"
    - "有枪"
    - "开枪"
    - "打起来了"
    - "紧急求助"
    - "出事了"
    - "受伤了"
    - "流血"
    - "着火"
    - "报警"
  # 911 按钮文案（AC-014 字段断言：引导拨打 911）
  call_911_prompt: "立即拨打 911（无需证件，接通后可免费要求中文翻译）"
  # 中文报警用语：接通后开口第一句（PRD 用户故事 29 原文）
  chinese_interpreter_phrase: "I need help. Can I have a Chinese interpreter?"
  # 报警信息准备清单：位置 / 发生了什么 / 是否需要救护车 / 嫌疑人特征
  info_checklist:
    - "你现在的具体位置（街道门牌号、路口或标志性建筑）"
    - "发生了什么（用一两句话简明描述事件）"
    - "是否有人受伤、是否需要救护车"
    - "嫌疑人特征（人数、衣着、携带物品、离开方向）"
  # 安抚话术：紧急模式全程保持平静、可操作的语气
  comfort_message: "先深呼吸，你现在是安全的。如果无法立即通话，先走进人多的公共场所或敲开附近商铺的门，我们会一步步陪你处理。"
  # 暗示定位的词：紧急话术与清单中一律禁止出现（无定位能力，不产生错误定位预期）
  proximity_blacklist: ["最近", "离你最近"]

# ============================================================================
# 情报 Agent 混合检索（issue 10 / T8，spec D2 / CONTEXT.md 混合检索）：
# FAISS 向量检索（语义，本地 embedding 模型）+ BM25 关键词检索（专名兜底），
# RRF 融合取 top-3，MVP 不引入重排层。community_info 由该警区三主题知识文档
# 确定性装配（零 LLM）；未记载事实输出统一标注，绝不编造。
# ============================================================================
intel:
  # 知识库未记载事实的统一输出（F7-3 诚实路径；如某警区是否有中文警员）
  unverified_label: "未核实到"

# ============================================================================
# 真实数据 adapter（issue 05 / M2，spec v2）：Socrata 单向管道配置。
# 运行方式：手动/月更离线脚本 scripts/fetch_nypd.py；运行时（产品代码）
# 永不直连外部 API。数据集 ID 以下载前核验的门户页面实际 URL 为准
# （resource-manifest §D 下载前核验规则）。
# ============================================================================
data_source:
  socrata_base_url: "https://data.cityofnewyork.us/resource"
  nypd_dataset_id: "qgea-i56i"     # D1 NYPD Complaint Data Historic
  output_dir: "fixtures/nypd_real"
  recorded_response: "tests/fixtures/socrata_response.json"
  request_timeout_seconds: 30
  page_limit: 50000                # Socrata 单次请求行数
  page_limit_max: 50000            # Socrata 单次请求行数硬上限（平台约束，校验 page_limit 用）
  # 运行时（生产）数据集路径（票 07 / M2 数据路径切换）：mock 数据集保留为测试资产，
  # 测试世界经 SAFEPASS_DATASET_PATH 环境变量钉到 fixtures/nypd/mock_nypd.csv
  # （tests/conftest.py），解析顺序：显式传参 > 环境变量 > 本键。
  runtime_dataset_path: "fixtures/nypd_real/real_nypd.csv"

# ============================================================================
# 成本三件套（票 06 / M2）：请求级限流 + 成本估算 + 降级明示话术。
# 窗口/阈值/估算系数/单价等字面量只出现在本节；日预算本身在
# token-budget.json（daily_cost_budget_usd，生产 = 5），由
# safepass/cost_control 读取。单价为估算值（USD / 1K tokens），以供应商
# 官网为准定期校准；未列出的模型按 default 条目估算。
# ============================================================================
cost_control:
  rate_limit:
    window_seconds: 60        # 滑动窗口（秒）；每包装器实例一个窗口（生产单实例接线）
    max_requests: 20          # 窗口内最大 LLM 调用数
  estimation:
    # 中文为主的查询按 ~2 字/token 保守高估（Qwen/DeepSeek 中文实际约 1-1.5 字/token），
    # 保证估算是上界近似：宁可高估不低估，熔断提前于破产。
    chars_per_token: 2
    prices_per_1k_tokens:
      deepseek-chat: { input: 0.00027, output: 0.0011 }   # prod 路由（≈$0.27/$1.10 per 1M）
      qwen-turbo: { input: 0.00005, output: 0.0002 }      # dev/test 路由（DashScope 估算）
      default: { input: 0.001, output: 0.003 }            # 未列出模型的兜底估算
  degraded_notice: "今日 AI 生成预算已用尽，本回复改由确定性数据与模板生成；安全评级与统计数据不受影响。"
  report_path: "logs/cost_report.jsonl"


# ============================================================================
# 生产模型接线（票 12 / M4，spec v2「生产模型接线」）：OpenAI 兼容端点客户端
# 的请求超时（秒）。接入点与模型名不进配置——生产经 env 注入
# （LLM_API_KEY / LLM_BASE_URL / LLM_MODEL，dev/test 用 DashScope Qwen 走
# cassette，见 eval 节），客户端构造的唯一注入点在 safepass/llm_wiring.py，
# 且产出必经票 06 的 BudgetFusedClient 包装（不可绕过）。
# ============================================================================
llm:
  request_timeout_seconds: 120

# ============================================================================
# 合成用户预检（票 10 / M3，spec v2「合成用户」节）：LLM 扮演用户 persona，
# 真人访谈前低成本戳访谈脚本、扩充金标输入。dev-only，走输出控制管线模式；
# 运行需一次性 DASHSCOPE_API_KEY（人工前置，scripts/run_synthetic_precheck.py）。
# 全部产出必须带 dev_reference_label 标注——合成用户永不冒充真人证据。
# ============================================================================
synthetic_user:
  model: "qwen-turbo"        # dev 路由（CLAUDE.md 模型路由：dev/test = DashScope Qwen）
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  interview_script: "fixtures/eval/interview_script_v1.json"   # 被预戳的访谈脚本草稿
  output_path: "fixtures/eval/synthetic_precheck_v1.json"      # 预检报告落盘
  dev_reference_label: "开发参考"   # 标注单一事实源：报告头 + 每条回答都盖此章
  reply_max_chars: 2000       # 单条回答字数上界（结构校验，防跑题失控）


# ============================================================================
# L2 LLM-as-judge 评估套件（issue 03 / M1，spec v2「L2」节）：
# judge = dev 模型（DashScope Qwen，考官考生同源）；judge 调用走 cassette
# 离线回放（tests/cassettes/l2_judge.json，录制入口 scripts/record_l2_cassette.py，
# 需一次性真实 DASHSCOPE_API_KEY；回放零真实调用）。
# 提示词模板本体在 safepass/evaluators.py（改写自 CASE-openevals使用，
# 来源逐组件标注）；此处锁定 judge 模型名、接入点与各模板版本——
# 评估基准不随依赖升级或模型切换悄悄漂移。
# ============================================================================
eval:
  judge_model: "qwen-turbo"     # dev/test 考官模型（CLAUDE.md 模型路由：DashScope Qwen 系列）
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  cassette: "tests/cassettes/l2_judge.json"
  pass_threshold: 0.7           # 判定通过分数下界（三项指标同口径）
  prompt_versions:
    groundedness: "sp-groundedness-v4"
    hallucination: "sp-hallucination-v4"
    relevance: "sp-relevance-v1"


